<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Live Subtitle Camera (ZH ⇄ EN)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { cyan: '#06b6d4', blue: '#3b82f6', dark: '#0f172a' }
          }
        }
      }
    }
  </script>
  <style>
    /* Mirror effect disabled by default for rear camera */
    .video-feed {
      object-fit: cover;
      transform: scaleX(1);
    }
    .video-mirror {
      transform: scaleX(-1);
    }
  </style>
</head>
<body class="h-full w-full flex flex-col font-sans bg-black overflow-hidden select-none">

  <!-- CAMERA FEED BACKGROUND -->
  <div class="absolute inset-0 z-0 bg-slate-950">
    <video id="camera-feed" class="w-full h-full video-feed" autoplay playsinline muted></video>
    
    <!-- Gradient Overlays for UI Readability -->
    <div class="absolute inset-x-0 top-0 h-32 bg-gradient-to-b from-black/80 via-black/40 to-transparent pointer-events-none"></div>
    <div class="absolute inset-x-0 bottom-0 h-64 bg-gradient-to-t from-black/90 via-black/50 to-transparent pointer-events-none"></div>
  </div>

  <!-- TOP BAR -->
  <header class="relative z-10 flex-none px-4 py-3 flex items-center justify-between">
    <!-- Direction Switcher -->
    <button id="direction-toggle-btn" onclick="toggleDirection()" class="flex items-center gap-2 bg-black/50 backdrop-blur-md border border-white/20 px-3.5 py-2 rounded-2xl text-xs sm:text-sm font-semibold text-white shadow-lg active:scale-95 transition-all">
      <span id="dir-src-flag">🇨🇳</span>
      <span id="dir-label">ZH ➔ EN</span>
      <span id="dir-tgt-flag">🇺🇸</span>
      <svg class="w-4 h-4 text-slate-300 ml-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
    </button>

    <div class="flex items-center gap-2">
      <!-- Switch Camera Facing Mode (Front / Back) -->
      <button onclick="toggleCameraFacing()" class="p-2.5 rounded-2xl bg-black/50 backdrop-blur-md border border-white/20 text-white shadow-lg active:scale-95 transition-all">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
      </button>

      <!-- Settings -->
      <button onclick="toggleSettingsModal()" class="p-2.5 rounded-2xl bg-black/50 backdrop-blur-md border border-white/20 text-white shadow-lg active:scale-95 transition-all">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path></svg>
      </button>
    </div>
  </header>

  <!-- MIDDLE OVERLAY DISPLAY -->
  <main class="relative z-10 flex-1 flex flex-col justify-end px-4 pb-24 max-w-2xl w-full mx-auto">
    
    <!-- Error Alert -->
    <div id="error-alert" class="hidden mb-4 bg-red-600/80 backdrop-blur-md text-white rounded-2xl p-3.5 text-xs sm:text-sm flex items-center justify-between border border-red-400">
      <span id="error-alert-msg">Camera or mic permission blocked.</span>
      <button onclick="dismissError()" class="font-bold ml-2">✕</button>
    </div>

    <!-- Live Floating Subtitle Box -->
    <div class="bg-black/65 backdrop-blur-lg border border-white/20 rounded-3xl p-5 sm:p-6 shadow-2xl flex flex-col justify-between space-y-4">
      
      <!-- Target Translated Text -->
      <div>
        <div class="flex items-center justify-between mb-1.5">
          <span id="target-lang-label" class="text-[11px] font-bold uppercase tracking-wider text-brand-cyan flex items-center gap-1.5">
            <span id="live-dot" class="w-2 h-2 rounded-full bg-slate-500"></span>
            English Subtitle
          </span>
          <span id="engine-badge" class="text-[10px] px-2 py-0.5 rounded-full bg-white/10 text-slate-300 font-mono">Free Engine</span>
        </div>
        <p id="target-subtitle" class="text-xl sm:text-3xl font-extrabold text-white leading-tight tracking-wide min-h-[2.5rem]">
          Tap "Start AR Camera" to begin
        </p>
      </div>

      <!-- Source Spoken Audio Transcript -->
      <div class="border-t border-white/10 pt-3">
        <span id="source-lang-label" class="text-[10px] font-semibold uppercase tracking-wider text-slate-400 block mb-0.5">Chinese Audio</span>
        <p id="source-transcript" class="text-xs sm:text-sm text-slate-300 font-medium italic min-h-[1.25rem]">
          ...
        </p>
      </div>

    </div>
  </main>

  <!-- BOTTOM CONTROL FOOTER -->
  <footer class="absolute bottom-0 inset-x-0 z-20 pb-6 pt-2 flex items-center justify-center px-4">
    <button id="toggle-btn" onclick="toggleARSession()" class="w-full max-w-xs px-6 py-3.5 rounded-2xl bg-gradient-to-r from-brand-cyan to-brand-blue hover:opacity-95 text-white font-bold text-base shadow-xl flex items-center justify-center gap-3 transition-all active:scale-95">
      <svg id="mic-icon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
      <span id="btn-text">Start AR Camera</span>
    </button>
  </footer>

  <!-- SETTINGS MODAL -->
  <div id="settings-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-white/10 rounded-3xl max-w-md w-full p-6 shadow-2xl">
      <h3 class="text-lg font-bold text-white mb-4 flex items-center justify-between">
        Settings
        <button onclick="toggleSettingsModal()" class="text-slate-400 hover:text-white">✕</button>
      </h3>

      <form onsubmit="saveSettings(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase mb-2">Translation API Engine</label>
          <select id="engine-select" onchange="handleEngineChange()" class="w-full bg-slate-800 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none">
            <option value="free">Free Engine (MyMemory API)</option>
            <option value="openai">OpenAI API (Custom Key)</option>
          </select>
        </div>

        <div id="openai-key-container" class="hidden">
          <label class="block text-xs font-semibold text-slate-300 uppercase mb-2">OpenAI API Key</label>
          <input type="password" id="setting-apikey" placeholder="sk-..." class="w-full bg-slate-800 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white font-mono text-sm">
        </div>

        <div class="pt-2 flex justify-end gap-2">
          <button type="button" onclick="toggleSettingsModal()" class="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-sm">Cancel</button>
          <button type="submit" class="px-4 py-2 rounded-xl bg-brand-cyan text-slate-950 font-bold text-sm">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let isARActive = false;
    let mediaStream = null;
    let recognition = null;
    let currentFacingMode = 'environment'; // 'environment' (back) or 'user' (front)
    let currentDirection = 'zh-to-en';
    let selectedEngine = localStorage.getItem('translator_engine') || 'free';
    let openAiKey = localStorage.getItem('openai_key') || '';
    let debounceTimer = null;

    const videoEl = document.getElementById('camera-feed');
    const toggleBtn = document.getElementById('toggle-btn');
    const btnText = document.getElementById('btn-text');
    const liveDot = document.getElementById('live-dot');
    const sourceTranscript = document.getElementById('source-transcript');
    const targetSubtitle = document.getElementById('target-subtitle');
    const errorAlert = document.getElementById('error-alert');
    const errorAlertMsg = document.getElementById('error-alert-msg');

    const langConfigs = {
      'zh-to-en': { speechLang: 'zh-CN', srcLabel: 'Chinese Audio', tgtLabel: 'English Subtitle', dirLabel: 'ZH ➔ EN', srcFlag: '🇨🇳', tgtFlag: '🇺🇸', pair: 'zh|en' },
      'en-to-zh': { speechLang: 'en-US', srcLabel: 'English Audio', tgtLabel: 'Chinese Subtitle', dirLabel: 'EN ➔ ZH', srcFlag: '🇺🇸', tgtFlag: '🇨🇳', pair: 'en|zh' }
    };

    // 1. Camera + Microphone Stream Capture
    async function startCameraAndMic() {
      try {
        const constraints = {
          video: { facingMode: { exact: currentFacingMode } },
          audio: true
        };

        // Fallback for desktop browsers without 'exact' facing mode
        try {
          mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
        } catch (e) {
          mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode }, audio: true });
        }

        videoEl.srcObject = mediaStream;

        // Apply mirror effect if using front camera
        if (currentFacingMode === 'user') {
          videoEl.classList.add('video-mirror');
        } else {
          videoEl.classList.remove('video-mirror');
        }

        return true;
      } catch (err) {
        console.error("Camera/Mic Error:", err);
        showError("Could not access camera/microphone. Please ensure permissions are enabled.");
        return false;
      }
    }

    function stopCameraAndMic() {
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }
      videoEl.srcObject = null;
    }

    async function toggleCameraFacing() {
      currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
      if (isARActive) {
        stopCameraAndMic();
        await startCameraAndMic();
      }
    }

    // 2. Speech Recognition Logic
    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        showError("Web Speech API is not supported in this browser. Please open in Mobile Chrome or Safari.");
        return false;
      }

      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = langConfigs[currentDirection].speechLang;

      recognition.onstart = () => {
        isARActive = true;
        updateUI(true);
      };

      recognition.onend = () => {
        if (isARActive) {
          try { recognition.start(); } catch (e) {}
        } else {
          updateUI(false);
        }
      };

      recognition.onresult = (event) => {
        let interimTranscript = '';
        let finalTranscript = '';

        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            finalTranscript += event.results[i][0].transcript;
          } else {
            interimTranscript += event.results[i][0].transcript;
          }
        }

        const text = finalTranscript || interimTranscript;
        if (text.trim()) {
          sourceTranscript.textContent = text;
          clearTimeout(debounceTimer);
          debounceTimer = setTimeout(() => translateText(text), 350);
        }
      };

      return true;
    }

    // 3. Start/Stop Master Toggle
    async function toggleARSession() {
      dismissError();

      if (isARActive) {
        isARActive = false;
        if (recognition) try { recognition.stop(); } catch (e) {}
        stopCameraAndMic();
        updateUI(false);
      } else {
        const cameraReady = await startCameraAndMic();
        if (cameraReady) {
          if (!recognition) initSpeechRecognition();
          try {
            recognition.lang = langConfigs[currentDirection].speechLang;
            recognition.start();
          } catch (e) {
            console.warn("Recognition start error:", e);
          }
        }
      }
    }

    // 4. Direction Swap
    async function toggleDirection() {
      const wasActive = isARActive;
      if (isARActive) {
        isARActive = false;
        if (recognition) try { recognition.stop(); } catch (e) {}
      }

      currentDirection = (currentDirection === 'zh-to-en') ? 'en-to-zh' : 'zh-to-en';
      const cfg = langConfigs[currentDirection];

      document.getElementById('dir-label').textContent = cfg.dirLabel;
      document.getElementById('dir-src-flag').textContent = cfg.srcFlag;
      document.getElementById('dir-tgt-flag').textContent = cfg.tgtFlag;
      document.getElementById('source-lang-label').textContent = cfg.srcLabel;
      document.getElementById('target-lang-label').childNodes[2].nodeValue = " " + cfg.tgtLabel;

      sourceTranscript.textContent = "...";
      targetSubtitle.textContent = "Ready";

      if (wasActive) {
        setTimeout(() => {
          isARActive = true;
          recognition.lang = cfg.speechLang;
          recognition.start();
        }, 300);
      }
    }

    // 5. Translation APIs
    async function translateText(text) {
      const cfg = langConfigs[currentDirection];
      try {
        let resText = "";
        if (selectedEngine === 'openai' && openAiKey) {
          resText = await fetchOpenAiTranslation(text, cfg);
        } else {
          resText = await fetchFreeTranslation(text, cfg.pair);
        }
        targetSubtitle.textContent = resText;
      } catch (e) {
        targetSubtitle.textContent = "[Translation Error]";
      }
    }

    async function fetchFreeTranslation(text, pair) {
      const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${pair}`);
      const data = await res.json();
      return data?.responseData?.translatedText || text;
    }

    async function fetchOpenAiTranslation(text, cfg) {
      const res = await fetch("https://api.openai.com/v1/chat/completions", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${openAiKey}` },
        body: JSON.stringify({
          model: "gpt-4o-mini",
          messages: [{ role: "system", content: `Translate to ${cfg.tgtLabel}` }, { role: "user", content: text }],
          temperature: 0.3
        })
      });
      const data = await res.json();
      return data?.choices[0]?.message?.content?.trim() || text;
    }

    // 6. UI Utilities
    function updateUI(active) {
      if (active) {
        liveDot.className = "w-2 h-2 rounded-full bg-emerald-400 animate-ping";
        btnText.textContent = "Stop Camera";
        toggleBtn.className = "w-full max-w-xs px-6 py-3.5 rounded-2xl bg-red-600 hover:bg-red-700 text-white font-bold text-base shadow-xl flex items-center justify-center gap-3 transition-all active:scale-95";
      } else {
        liveDot.className = "w-2 h-2 rounded-full bg-slate-500";
        btnText.textContent = "Start AR Camera";
        toggleBtn.className = "w-full max-w-xs px-6 py-3.5 rounded-2xl bg-gradient-to-r from-brand-cyan to-brand-blue hover:opacity-95 text-white font-bold text-base shadow-xl flex items-center justify-center gap-3 transition-all active:scale-95";
      }
    }

    function showError(msg) {
      errorAlertMsg.textContent = msg;
      errorAlert.classList.remove('hidden');
    }

    function dismissError() {
      errorAlert.classList.add('hidden');
    }

    function toggleSettingsModal() {
      document.getElementById('settings-modal').classList.toggle('hidden');
      document.getElementById('engine-select').value = selectedEngine;
      document.getElementById('setting-apikey').value = openAiKey;
      handleEngineChange();
    }

    function handleEngineChange() {
      const val = document.getElementById('engine-select').value;
      document.getElementById('openai-key-container').classList.toggle('hidden', val !== 'openai');
    }

    function saveSettings(e) {
      e.preventDefault();
      selectedEngine = document.getElementById('engine-select').value;
      openAiKey = document.getElementById('setting-apikey').value.trim();
      localStorage.setItem('translator_engine', selectedEngine);
      localStorage.setItem('openai_key', openAiKey);
      document.getElementById('engine-badge').textContent = (selectedEngine === 'openai') ? 'OpenAI Engine' : 'Free Engine';
      toggleSettingsModal();
    }
  </script>
</body>
</html>
